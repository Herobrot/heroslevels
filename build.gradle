plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}
version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}
repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    mavenCentral()
    flatDir(
            dirs: 'libs'
    )
}
base {
    archivesName = mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    java {
        withSourcesJar()
    }
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
dependencies {
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    //Compile

    //Test
    //runtimeOnly("com.herobrot.scalingdifficulty:scalingdifficulty:${scalingdifficulty_version}")
    //runtimeOnly("com.herobrot.levelplate:levelplate:${levelplate_version}")

}
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties(replaceProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getChangelogText() {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog found."
    }
    def text = changelogFile.text
    def matcher = text =~ /(?s)^(# .*?\n)(.*?)(?=\n# |\n---|\Z)/

    if (matcher.find()) {
        return matcher.group(2).trim()
    }
    return text.trim()
}
publishMods {
    file = jar.archiveFile
    changelog = getChangelogText()
    type = STABLE
    modLoaders.add("neoforge")
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = curseforge_id
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        requires("cloth-config")
        changelogType = "markdown"
        displayName = jar.archiveFileName.get()
    }
    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = modrinth_id
        minecraftVersions.add(minecraft_version)
        requires("cloth-config")
        environment=CLIENT_AND_SERVER
    }
    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "Herobrot/${mod_id}"
        commitish = "1.21"
        additionalFiles.from(tasks.named("sourcesJar"))
    }
}