}
tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties(replaceProperties)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(replaceProperties)
    }
}
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getChangelogText() {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog found."
    }
    def text = changelogFile.text
    def matcher = text =~ /(?s)^(# .*?\n)(.*?)(?=\n# |\n---|\Z)/

    if (matcher.find()) {
        return matcher.group(2).trim()
    }
    return text.trim()
}
publishMods {
    file = jar.archiveFile
    changelog = getChangelogText()
    type = STABLE
    modLoaders.add("neoforge")
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = curseforge_id
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        requires("cloth-config")
        requires("heros-lib")
        changelogType = "markdown"
        displayName = jar.archiveFileName.get()
    }
    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = modrinth_id
        minecraftVersions.add(minecraft_version)
        requires("cloth-config")
        requires("heros-lib")
        environment = CLIENT_AND_SERVER
        version = "${mod_version}+${minecraft_version}"
    }
    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = "Herobrot/${mod_id}"
        tagName="${mod_version}+${minecraft_version}"
        displayName = "${mod_name} ${mod_version}+${minecraft_version}"
        commitish = "1.21"
        additionalFiles.from(tasks.named("sourcesJar"))
    }
}