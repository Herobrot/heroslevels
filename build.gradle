plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
}
tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}
repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = 'https://maven.wispforest.io/releases' }
    maven { url = "https://maven.su5ed.dev/releases" }
    maven { url = "https://maven.fabricmc.net" }
    maven { url = "https://maven.theillusivec4.top/" }
    mavenCentral()
    flatDir(
            dirs: 'libs'
    )
}
base {
    archivesName = mod_id
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    java {
        withSourcesJar()
    }
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
dependencies {
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")
    implementation("com.herobrot.heroslib:heroslib:${heroslib_version}")

    //Compile
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    compileOnly "io.wispforest:accessories-neoforge:1.1.0-beta.53+1.21.1"
    compileOnly "maven.modrinth:jade:15.10.5+neoforge"
    compileOnly "maven.modrinth:puzzles-lib:v21.1.52-1.21.1-NeoForge" //lib for Fuzs mods
    compileOnly "maven.modrinth:easy-magic:v21.1.4-1.21.1-NeoForge"
    compileOnly "maven.modrinth:easy-anvils:v21.1.0-1.21.1-NeoForge"
    compileOnly "maven.modrinth:enchanting-infuser:v21.1.4-1.21.1-NeoForge"
    compileOnly "maven.modrinth:apothic-enchanting:1.21.1-1.6.0"

    //Test
    //runtimeOnly("com.herobrot.scalingdifficulty:scalingdifficulty:${scalingdifficulty_version}")
    //runtimeOnly("com.herobrot.levelplate:levelplate:${levelplate_version}")

    //Fuzs mods -> tested and compatible <-
